name: Build Fill-Vault release ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare browser libraries
        run: bash setup.sh

      - name: Build ZIP
        run: bash build-release.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fill-Vault
          path: dist/Fill-Vault.zip
